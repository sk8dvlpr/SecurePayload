name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl, json, mbstring
          coverage: none
          ini-values: error_reporting=-1
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Sync composer.lock
        run: composer update --lock --no-install
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint (syntax)
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse -c phpstan.neon
      - name: Run tests
        run: vendor/bin/phpunit
        env:
          # Surface PHP 8.5 deprecations as failures when available
          PHPUNIT_DEPRECATIONS: ${{ matrix.php == '8.5' && '1' || '0' }}

  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [laravel, symfony, ci4, slim, cli]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, curl, json, mbstring
          coverage: none
      - name: Sync composer.lock
        run: composer update --lock --no-install
      - name: Install core dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Install package dependencies
        working-directory: packages/${{ matrix.package }}
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run package tests
        working-directory: packages/${{ matrix.package }}
        run: vendor/bin/phpunit -c phpunit.xml.dist
      - name: Static Analysis (PHPStan)
        working-directory: packages/${{ matrix.package }}
        run: vendor/bin/phpstan analyse -c phpstan.neon

  node-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json
          coverage: none
      - name: Sync composer.lock
        run: composer update --lock --no-install
      - name: Install PHP dependencies (interop)
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/node-sdk/package-lock.json
      - name: Install dependencies
        working-directory: packages/node-sdk
        run: npm ci
      - name: Type check
        working-directory: packages/node-sdk
        run: npm run lint
      - name: Run Node SDK tests
        working-directory: packages/node-sdk
        run: npm test

  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: packages/go-sdk/go.sum
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json
          coverage: none
      - name: Sync composer.lock
        run: composer update --lock --no-install
      - name: Install PHP dependencies (interop)
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run Go SDK tests
        working-directory: packages/go-sdk
        run: go test ./...

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json
          coverage: none
      - name: Sync composer.lock
        run: composer update --lock --no-install
      - name: Install PHP dependencies (interop)
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python SDK (with dev deps)
        run: pip install -e "packages/python-sdk[dev]"
      - name: Run Python SDK tests
        working-directory: packages/python-sdk
        run: pytest -q
