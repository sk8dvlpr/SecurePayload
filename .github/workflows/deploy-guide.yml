# Deploy SecurePayload User Guide to GitHub Pages.
# Settings → Pages → Source = GitHub Actions (not "Deploy from a branch").

name: Deploy User Guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - ".github/workflows/deploy-guide.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-guide
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build guide
        run: |
          set -euo pipefail
          python --version
          python -u guide/tools/generate.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: guide/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
