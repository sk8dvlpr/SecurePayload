[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sk8dvlpr-securepayload"
version = "0.1.0"
description = "Python SDK untuk SecurePayload protocol v3 (byte-exact dengan PHP core)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sk8dvlpr" }]
keywords = ["securepayload", "hmac", "aead", "xchacha20", "request-signing"]
dependencies = [
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "conformance_v3: conformance byte-exact terhadap docs/fixtures/v3",
]
